[project]
name = "gallery-enhanced"
version = "2.20.2"
description = "Fast ComfyUI output gallery with batch selection, trash/favorites, quick cleanup, folder editing, A/B comparison, mask editing, and gallery loader nodes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Nivarrym" }]
dependencies = [
    "aiohttp",
    "Pillow>=9.5.0",
    "watchdog",
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/Nivarrym/ComfyUI-Gallery-Fork"
Documentation = "https://github.com/Nivarrym/ComfyUI-Gallery-Fork/blob/main/README.md"
"Bug Tracker" = "https://github.com/Nivarrym/ComfyUI-Gallery-Fork/issues"
Upstream = "https://github.com/PanicTitan/ComfyUI-Gallery"

[tool.comfy]
PublisherId = "nivarrym"
DisplayName = "GalleryEnhanced"
Icon = "https://raw.githubusercontent.com/Nivarrym/ComfyUI-Gallery-Fork/main/icon.png"
